# Render Blueprint — GitHub 저장소 연결 시 웹 서비스 자동 생성
# DB는 Supabase(외부) 사용: render.yaml에는 비밀번호를 두지 않으므로
# 생성된 서비스의 Environment 탭에서 DATABASE_URL을 직접 입력해야 합니다.
services:
  - type: web
    name: amado-economy
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
